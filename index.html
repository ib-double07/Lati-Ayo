<!DOCTYPE html>
<html lang="en">
<head>
<meta property="og:type" content="website">
<meta property="og:title" content="Lati & Ayo – Wedding Invitation">
<meta property="og:description" content="You’re invited to celebrate with us. Tap to open.">
<meta property="og:image" content="https://lati-ayo.onrender.com/og.jpg">
<meta property="og:url" content="https://lati-ayo.onrender.com/">
<meta name="twitter:card" content="summary_large_image">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latifah &amp; Ayoke – Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1530;--deep:#13224a;--gold:#d4af6a;--ivory:#f3ead7;--rose:#ff6b95;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth}
body{margin:0;background:var(--navy);color:var(--ivory);font:400 16px/1.65 Jost,system-ui,sans-serif}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;margin:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.hero{position:relative;height:100svh;min-height:560px;overflow:hidden;display:grid;place-items:center;text-align:center}
.slide{position:absolute;inset:0;background-size:cover;background-position:center 22%;opacity:0;transform:scale(1);transition:opacity 1.6s ease}
.slide.on{opacity:1;animation:kb 9s ease-out forwards}
@keyframes kb{to{transform:scale(1.12)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,#0b153099,#0b1530cc 70%,var(--navy))}
.hero-t{position:relative;z-index:2;padding:0 24px}
.hero-t p{margin:0;letter-spacing:.14em;font-size:14px;color:var(--gold)}
.hero h1{font-size:clamp(52px,17vw,96px);line-height:1;margin:14px 0;font-style:italic}
.hero .d{font-size:18px}
.dots{position:absolute;bottom:28px;left:0;right:0;z-index:2;display:flex;justify-content:center;gap:8px}
.dots i{width:7px;height:7px;border-radius:50%;background:#fff5;transition:.4s}
.dots i.on{background:var(--gold);width:22px;border-radius:4px}
main{max-width:480px;margin:0 auto;padding:0 22px}
section{padding:54px 0;text-align:center}
h2{font-size:36px;font-style:italic;color:var(--gold);margin-bottom:10px}
.sub{color:#cfd3e6;margin:0 0 24px}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ring{position:relative;aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}
.ring .bg{stroke:#d4af6a33}
.ring .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:500 clamp(24px,8vw,34px) "Cormorant Garamond",serif}
.lab{font-size:13px;color:#cfd3e6;margin-top:4px}
.frame{border:2px solid var(--gold);padding:8px;background:var(--deep);box-shadow:0 14px 40px #0008}
.ph{aspect-ratio:4/5;background-size:cover;background-position:center 20%;clip-path:inset(0 0 100% 0);transition:clip-path 1.4s cubic-bezier(.2,.7,.2,1)}
.in .ph{clip-path:inset(0)}
.story{display:grid;gap:26px}
.story h3{font-size:28px;font-style:italic;margin-top:14px}
.story p{margin:6px 0 0;color:#cfd3e6}
.fade{opacity:0;transform:translateY(18px);transition:opacity 1s,transform 1s}
.in.fade,.in .fade{opacity:1;transform:none}
.card{background:var(--deep);border:1px solid #d4af6a55;padding:22px;margin-top:14px}
.btn{display:inline-block;margin-top:14px;background:var(--gold);color:var(--navy);text-decoration:none;font:500 16px Jost,sans-serif;padding:12px 26px;border:0;border-radius:99px;cursor:pointer}
.btn.o{background:none;color:var(--ivory);border:1px solid var(--gold)}
ul{list-style:none;margin:0;padding:0;text-align:left}
li{display:flex;gap:18px;padding:12px 0;border-bottom:1px solid #d4af6a33}
li time{min-width:62px;color:var(--gold);font-weight:500}
.heart{width:84px;height:84px;margin:6px auto 14px;color:var(--rose);animation:beat 1.6s infinite}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.18)}28%{transform:scale(1)}42%{transform:scale(1.12)}}
#msg{min-height:1.6em;color:var(--gold);margin-top:14px}
#mu{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;align-items:center;gap:8px;background:var(--deep);color:var(--gold);border:1px solid var(--gold);border-radius:99px;padding:10px 16px;font:500 14px Jost,sans-serif;cursor:pointer;box-shadow:0 6px 24px #0009}
#mu i{display:flex;gap:2px;align-items:flex-end;height:14px}
#mu i b{width:3px;height:4px;background:var(--gold);border-radius:2px}
#mu.on i b{animation:eq 1s ease-in-out infinite}
#mu.on i b:nth-child(2){animation-delay:.25s}
#mu.on i b:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
body.lock{overflow:hidden;height:100svh}
#op{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 35%,var(--deep),var(--navy) 70%);display:grid;place-items:center;text-align:center;padding:24px;transition:opacity .9s ease}
#op.gone{opacity:0;pointer-events:none}
#op .in2{border:1px solid var(--gold);padding:44px 28px;max-width:340px;width:100%;outline:1px solid #d4af6a55;outline-offset:8px}
#op p{margin:0;color:var(--gold);letter-spacing:.14em;font-size:13px}
#op h2{font-size:clamp(44px,14vw,64px);line-height:1.05;margin:16px 0 8px;color:var(--ivory)}
#op .btn{margin-top:26px}
.cue{position:absolute;left:0;right:0;bottom:62px;z-index:3;background:none;border:0;color:var(--gold);font:500 14px Jost,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:opacity .5s}
.cue.hide{opacity:0;pointer-events:none}
.cue svg{width:26px;height:26px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(9px);opacity:1}}
@media (prefers-reduced-motion:reduce){.cue svg{animation:none}}
footer{text-align:center;color:#8d93b3;padding:20px 0 40px;font-size:14px}
@media (prefers-reduced-motion:reduce){.slide.on,.heart{animation:none}.ph{clip-path:none;transition:none}.fade{opacity:1;transform:none;transition:none}}
</style>
</head>
<body class="lock">
<div id="op"><div class="in2"><p>YOU’RE INVITED</p><h2 id="opn"></h2><div id="opd" style="color:#cfd3e6"></div><button class="btn" id="open" type="button">Open invitation</button></div></div>
<button id="mu" type="button" aria-pressed="false" aria-label="Play background music"><i aria-hidden="true"><b></b><b></b><b></b></i><span id="mut">Play music</span></button>
<header class="hero" id="hero">
  <div id="slides"></div>
  <div class="hero-t">
    <p id="lead"></p>
    <h1 id="names"></h1>
    <div class="d" id="date"></div>
  </div>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <button class="cue" id="cue" type="button" aria-label="Scroll down"><span>Scroll down</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
</header>
<main>
  <section class="reveal">
    <h2>The countdown</h2>
    <p class="sub" id="cd-sub">Until we say “I do”</p>
    <div class="rings" id="rings" role="timer" aria-live="off"></div>
  </section>
  <section class="reveal">
    <h2>Our story</h2>
    <div class="story" id="story"></div>
  </section>
  <section class="reveal">
    <h2>The details</h2>
    <div class="card fade">
      <h3 id="venue" style="font-size:28px"></h3>
      <p id="addr" class="sub" style="margin:6px 0 0"></p>
      <a class="btn o" id="map" target="_blank" rel="noopener">Get directions</a>
    </div>
    <div class="card fade"><h3 style="font-size:26px;margin-bottom:6px">Colours of the day</h3><p id="colours" style="margin:0"></p></div>
  </section>
  <section class="reveal">
    <h2>The schedule</h2>
    <ul id="sched" class="fade"></ul>
  </section>
  <section class="reveal">
    <svg class="heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.5 2.8 4.5 6.6 4.5c2.2 0 3.7 1.2 5.4 3.2 1.7-2 3.2-3.2 5.4-3.2 3.8 0 5.7 4 4.2 7.3C19.5 16.4 12 21 12 21z"/></svg>
    <h2>Will you be there?</h2>
    <p class="sub">Tap to let us know.</p>
    <button class="btn" data-r="yes">I’ll be there</button>
    <button class="btn o" data-r="no">Can’t make it</button>
    <p id="msg" role="status"></p>
    <p class="sub">Questions? <a id="tel" style="color:var(--gold)"></a></p>
  </section>
</main>
<footer id="foot"></footer>
<script>
/* ===== Edit only this block for each new client ===== */
const C={
  lead:"JOIN US AS WE TIE THE KNOT",
  names:"latifah & Ayoke",
  when:"2026-12-26T11:00:00+01:00",
  dateText:"Saturday, 26th December 2026",
  hashtag:"#LatiAyo2026",
  music:"",   // link to the couple's song file (e.g. "song.mp3"). Leave empty to use the soft built-in melody.
 photos:["1.jpg","2.jpg","3.jpg","4.jpg"],
  story:[
    {t:"How we met",p:"A chance hello that turned into every conversation we never wanted to end.",img:0},
    {t:"The proposal",p:"One question, one yes, and the start of forever.",img:2}
  ],
  venue:"Damilek Multipurpose Events Centre",
  addr:"Afao Road, Oke-Ayo, Ado-Ekiti",
  colours:"White, olive green, burgundy and nude pink",
  sched:[["11:00","Wedding ceremony"],["13:00","Reception"],["16:00","First dance and cake"]],
  tel:"090 6585 0235",
  thanks:"Thank you! We can’t wait to celebrate with you."
};
/* ==================================================== */
const $=id=>document.getElementById(id);
function ph(a,b){const s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+a+'"/><stop offset="1" stop-color="'+b+'"/></linearGradient></defs><rect width="400" height="500" fill="url(#g)"/><circle cx="150" cy="190" r="34" fill="#ffffff55"/><rect x="108" y="232" width="84" height="190" rx="40" fill="#ffffff44"/><circle cx="256" cy="200" r="30" fill="#ffffff66"/><rect x="216" y="240" width="80" height="182" rx="38" fill="#ffffff55"/></svg>';return"url(\"data:image/svg+xml;utf8,"+encodeURIComponent(s)+"\")"}
const PAL=[["#7a2b4a","#e8a2b8"],["#1f5a54","#9ad0b8"],["#6a4a1f","#e6c27a"]];
const imgs=Array.from({length:Math.max(3,C.photos.length)},(_,i)=>i).map(i=>C.photos[i]?"url('"+C.photos[i]+"')":ph(PAL[i%3][0],PAL[i%3][1]));
$("lead").textContent=C.lead;$("names").textContent=C.names;$("date").textContent=C.dateText;
$("slides").innerHTML=imgs.map((u,i)=>'<div class="slide'+(i?'':' on')+'" style="background-image:'+u+'"></div>').join("");
$("dots").innerHTML=imgs.map((_,i)=>'<i'+(i?'':' class="on"')+'></i>').join("");
let k=0;const sl=[...document.querySelectorAll(".slide")],dt=[...document.querySelectorAll(".dots i")];
setInterval(()=>{sl[k].classList.remove("on");dt[k].classList.remove("on");k=(k+1)%sl.length;sl[k].classList.add("on");dt[k].classList.add("on")},5500);
$("story").innerHTML=C.story.map(s=>'<article class="reveal"><div class="frame"><div class="ph" style="background-image:'+imgs[s.img%imgs.length]+'"></div></div><h3 class="fade">'+s.t+'</h3><p class="fade">'+s.p+'</p></article>').join("");
$("venue").textContent=C.venue;$("addr").textContent=C.addr;$("colours").textContent=C.colours;
$("map").href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(C.venue+" "+C.addr);
$("sched").innerHTML=C.sched.map(s=>"<li><time>"+s[0]+"</time><span>"+s[1]+"</span></li>").join("");
$("tel").textContent=C.tel;$("tel").href="tel:"+C.tel.replace(/\s/g,"");
$("foot").textContent=C.hashtag+" · Invited with love";
const R=34,L=2*Math.PI*R,U=[["Days",365],["Hours",24],["Minutes",60],["Seconds",60]];
$("rings").innerHTML=U.map(u=>'<div><div class="ring"><svg viewBox="0 0 80 80"><circle class="bg" cx="40" cy="40" r="'+R+'"/><circle class="fg" cx="40" cy="40" r="'+R+'" stroke-dasharray="'+L+'" stroke-dashoffset="'+L+'"/></svg><b>00</b></div><div class="lab">'+u[0]+'</div></div>').join("");
const fg=[...document.querySelectorAll(".fg")],nb=[...document.querySelectorAll(".ring b")];
const T=new Date(C.when).getTime();
function tick(){
  const d=Math.max(0,T-Date.now());
  const v=[Math.floor(d/864e5),Math.floor(d/36e5)%24,Math.floor(d/6e4)%60,Math.floor(d/1e3)%60];
  v.forEach((n,i)=>{nb[i].textContent=String(n).padStart(2,"0");fg[i].style.strokeDashoffset=L*(1-Math.min(n,U[i][1])/U[i][1])});
  if(d===0){$("cd-sub").textContent="Today is the day. Happily married!"}
}
tick();setInterval(tick,1000);
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.2});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{$("msg").textContent=b.dataset.r==="yes"?C.thanks:"Thanks for letting us know. You’ll be missed."});
/* Music: browsers block autoplay, so it starts on the first tap */
let au,ac,mt,pl=false;
const CH=[[220,261.6,329.6],[174.6,220,261.6],[261.6,329.6,392],[196,246.9,293.7]];
function chord(i){const t=ac.currentTime;CH[i%4].forEach(f=>{const o=ac.createOscillator(),g=ac.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+1);g.gain.linearRampToValueAtTime(0,t+4.2);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+4.3)})}
function setMu(on){pl=on;$("mu").classList.toggle("on",on);$("mu").setAttribute("aria-pressed",on);$("mut").textContent=on?"Pause music":"Play music"}
$("mu").onclick=()=>{
  if(pl){if(C.music)au.pause();else{clearInterval(mt);}setMu(false);return}
  if(C.music){au=au||Object.assign(new Audio(C.music),{loop:true});au.play().catch(()=>{});}
  else{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();let n=0;chord(n++);mt=setInterval(()=>chord(n++),4000)}
  setMu(true)};
/* Opening screen: the tap that opens the invitation also starts the music */
$("opn").textContent=C.names;$("opd").textContent=C.dateText;
$("open").onclick=()=>{document.body.classList.remove("lock");$("op").classList.add("gone");setTimeout(()=>$("op").remove(),900);if(!pl)$("mu").click();scrollTo(0,0)};
const cue=$("cue");cue.onclick=()=>document.querySelector("main").scrollIntoView({behavior:"smooth"});
addEventListener("scroll",()=>cue.classList.toggle("hide",scrollY>60),{passive:true});
</script>
</body>
</html>
